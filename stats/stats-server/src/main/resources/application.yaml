
spring:
  application:
    name: stats-server
  config:
    import: "configserver:"
  cloud:
    config:
      uri: ${SPRING_CLOUD_CONFIG_URI:http://config-server:8888}
      fail-fast: true
      retry:
        max-attempts: 6
        initial-interval: 1500
        use-random-policy: true
        max-interval: 6000

eureka:
  client:
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}