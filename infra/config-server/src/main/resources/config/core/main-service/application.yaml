server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:ewm-db}:${POSTGRES_PORT:5432}/ewm-main
    username: ${POSTGRES_USER:main}
    password: ${POSTGRES_PASSWORD:main}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
      properties:
        hibernate:
          format_sql: true
          show_sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

ewm:
  stats-server:
    id: stats-server

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:discovery-server}:${EUREKA_PORT:8761}/eureka/

# Resilience4j: circuit breaker для Feign-клиентов
resilience4j:
  circuitbreaker:
    instances:
      user-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
      request-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
  retry:
    instances:
      user-service:
        maxAttempts: 3
        waitDuration: 1s
      request-service:
        maxAttempts: 3
        waitDuration: 1s

feign:
  okhttp:
    enabled: true
  circuitbreaker:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.springframework.cloud.loadbalancer: DEBUG

