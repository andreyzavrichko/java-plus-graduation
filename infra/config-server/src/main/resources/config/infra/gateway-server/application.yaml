server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: user_service_admin_route
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: request_service_route
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests, /users/*/requests/**

        - id: extra_service_compilations_route
          uri: lb://compilation-service
          predicates:
            - Path=/compilations/**, /admin/compilations/**

        - id: extra_service_comments_route
          uri: lb://compilation-service
          predicates:
            - Path=/events/*/comments/**, /admin/comments/**

        - id: extra_service_user_comments_route
          uri: lb://compilation-service
          predicates:
            - Path=/users/*/comments/**

        - id: event_service_route
          uri: lb://event-service
          predicates:
            - Path=/categories/**, /admin/categories/**, /admin/events/**, /users/**, /events/**

        - id: stats_server_route
          uri: lb://stats-server
          predicates:
            - Path=/hit/**, /stats/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  health:
    circuitbreakers:
      enabled: false
    diskspace:
      enabled: false