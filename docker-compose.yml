services:

  # ─── Инфраструктура ────────────────────────────────────────────
  discovery-server:
    build: infra/discovery-server
    image: ewm-discovery-server
    container_name: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: wget -q --spider http://localhost:8761/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  config-server:
    build: infra/config-server
    image: ewm-config-server
    container_name: config-server
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      - SERVER_PORT=8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
    healthcheck:
      test: wget -q --spider http://localhost:8888/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-server:
    build: infra/gateway-server
    image: ewm-gateway-server
    container_name: gateway-server
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false
    healthcheck:
      test: wget -q --spider http://localhost:8080/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ─── Kafka (KRaft, два listener: внутренний + внешний) ─────────
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: K0EA9p0yEe6MkAAAAkKsEg
    healthcheck:
      test: kafka-topics --bootstrap-server localhost:9092 --list || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  kafka-init:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >-
      -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.user-actions.v1 --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stats.events-similarity.v1 --partitions 1 --replication-factor 1
      "

  # ─── Базы данных ───────────────────────────────────────────────
  stats-db:
    image: postgres:16.1
    container_name: stats-db-postgres
    volumes:
      - ./stats/stats-server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "6542:5432"
    environment:
      - POSTGRES_DB=stats
      - POSTGRES_USER=stats
      - POSTGRES_PASSWORD=stats
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db-postgres
    volumes:
      - ./core/event-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    ports:
      - "6543:5432"
    environment:
      - POSTGRES_DB=ewm-main
      - POSTGRES_USER=main
      - POSTGRES_PASSWORD=main
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  user-db:
    image: postgres:16.1
    container_name: user-db-postgres
    volumes:
      - ./core/user-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/03-schema.sql
    ports:
      - "6544:5432"
    environment:
      - POSTGRES_DB=ewm-users
      - POSTGRES_USER=users
      - POSTGRES_PASSWORD=users
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  request-db:
    image: postgres:16.1
    container_name: request-db-postgres
    volumes:
      - ./core/request-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/04-schema.sql
    ports:
      - "6545:5432"
    environment:
      - POSTGRES_DB=ewm-requests
      - POSTGRES_USER=requests
      - POSTGRES_PASSWORD=requests
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  compilation-db:
    image: postgres:16.1
    container_name: compilation-db-postgres
    volumes:
      - ./core/compilation-service/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/05-schema.sql
    ports:
      - "6546:5432"
    environment:
      - POSTGRES_DB=ewm-compilation
      - POSTGRES_USER=compilation
      - POSTGRES_PASSWORD=compilation
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  analyzer-db:
    image: postgres:16.1
    container_name: analyzer-db-postgres
    volumes:
      - ./stats/analyzer/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/06-schema.sql
    ports:
      - "6547:5432"
    environment:
      - POSTGRES_DB=analyzer
      - POSTGRES_USER=analyzer
      - POSTGRES_PASSWORD=analyzer
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  # ─── Сервисы ───────────────────────────────────────────────────
  stats-server:
    build: stats/stats-server
    image: ewm-stats-server
    container_name: stats-server
    depends_on:
      config-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - POSTGRES_HOST=stats-db
      - POSTGRES_USER=stats
      - POSTGRES_PASSWORD=stats
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false

  collector:
    build: stats/collector
    image: ewm-collector
    container_name: collector
    ports:
      - "9091:9091"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=localhost
      - EUREKA_INSTANCE_PREFERIPADDRESS=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false
      - GRPC_SERVER_PORT=9091

  aggregator:
    build: stats/aggregator
    image: ewm-aggregator
    container_name: aggregator
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false

  analyzer:
    build: stats/analyzer
    image: ewm-analyzer
    container_name: analyzer
    ports:
      - "9095:9095"
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      analyzer-db:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - EUREKA_INSTANCE_HOSTNAME=localhost
      - EUREKA_INSTANCE_PREFERIPADDRESS=false
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=analyzer-db
      - POSTGRES_USER=analyzer
      - POSTGRES_PASSWORD=analyzer
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false
      - GRPC_SERVER_PORT=9095

  event-service:
    build: core/event-service
    image: ewm-event-service
    container_name: event-service
    depends_on:
      config-server:
        condition: service_healthy
      ewm-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - POSTGRES_HOST=ewm-db
      - POSTGRES_USER=main
      - POSTGRES_PASSWORD=main
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false

  user-service:
    build: core/user-service
    image: ewm-user-service
    container_name: user-service
    depends_on:
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - POSTGRES_HOST=user-db
      - POSTGRES_USER=users
      - POSTGRES_PASSWORD=users
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false

  request-service:
    build: core/request-service
    image: ewm-request-service
    container_name: request-service
    depends_on:
      config-server:
        condition: service_healthy
      request-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - POSTGRES_HOST=request-db
      - POSTGRES_USER=requests
      - POSTGRES_PASSWORD=requests
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false

  compilation-service:
    build: core/compilation-service
    image: ewm-compilation-service
    container_name: compilation-service
    depends_on:
      config-server:
        condition: service_healthy
      compilation-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - POSTGRES_HOST=compilation-db
      - POSTGRES_USER=compilation
      - POSTGRES_PASSWORD=compilation
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false